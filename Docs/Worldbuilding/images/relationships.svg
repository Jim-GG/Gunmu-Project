<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" role="img" aria-label="零界人物与阵营关系图"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#667a88"/></marker></defs><rect width="100%" height="100%" fill="#f5f2e9"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" fill="#1c2e38"><text x="45" y="48" font-size="30" fill="#1c2e38" font-weight="700">人物与阵营关系</text><text x="45" y="80" font-size="17" fill="#63747b" font-weight="400">身份席位尚未命名；人员存活、领导关系与事故责任保持留白。</text><rect x="40" y="130" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="40" y="130" width="6" height="120" rx="3" fill="#53797c"/><text x="60" y="163" font-size="21" fill="#53797c" font-weight="700">C04 · 苏联高层</text><text x="60" y="194" font-size="16" fill="#1c2e38" font-weight="400">首次共振受影响【已定】</text><text x="60" y="220" font-size="16" fill="#1c2e38" font-weight="400">姓名、最终下落未知</text><rect x="430" y="130" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="430" y="130" width="6" height="120" rx="3" fill="#53797c"/><text x="450" y="163" font-size="21" fill="#53797c" font-weight="700">苏联科研体系</text><text x="450" y="194" font-size="16" fill="#1c2e38" font-weight="400">不断扩建共振实验室</text><text x="450" y="220" font-size="16" fill="#1c2e38" font-weight="400">权力推动研究规模【已定】</text><rect x="820" y="130" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="820" y="130" width="6" height="120" rx="3" fill="#53797c"/><text x="840" y="163" font-size="21" fill="#53797c" font-weight="700">C05 · 回应者群体</text><text x="840" y="194" font-size="16" fill="#1c2e38" font-weight="400">成瘾与秘密结社【已定】</text><text x="840" y="220" font-size="16" fill="#1c2e38" font-weight="400">组织称谓【沿用待核】</text><path d="M340 190H430" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="339" y="152" width="80" height="25" fill="#f5f2e9"/><text x="347" y="170" font-size="16" fill="#526672" font-weight="400">推动扩建</text><path d="M730 190H820" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="729" y="152" width="80" height="25" fill="#f5f2e9"/><text x="737" y="170" font-size="16" fill="#526672" font-weight="400">成员转化</text><rect x="40" y="400" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="40" y="400" width="6" height="120" rx="3" fill="#53797c"/><text x="60" y="433" font-size="21" fill="#53797c" font-weight="700">C06 · 普通工作人员</text><text x="60" y="464" font-size="16" fill="#1c2e38" font-weight="400">不默认全员自愿参与</text><text x="60" y="490" font-size="16" fill="#1c2e38" font-weight="400">人员暴露与转化【已定】</text><rect x="430" y="400" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="430" y="400" width="6" height="120" rx="3" fill="#53797c"/><text x="450" y="433" font-size="21" fill="#53797c" font-weight="700">同类异常晶体</text><text x="450" y="464" font-size="16" fill="#1c2e38" font-weight="400">阿比森纳斯【已定名称】</text><text x="450" y="490" font-size="16" fill="#1c2e38" font-weight="400">CSM-017【沿用待核】</text><rect x="820" y="400" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="820" y="400" width="6" height="120" rx="3" fill="#53797c"/><text x="840" y="433" font-size="21" fill="#53797c" font-weight="700">现代科研团队 / C03</text><text x="840" y="464" font-size="16" fill="#1c2e38" font-weight="400">无需人体合成【已定】</text><text x="840" y="490" font-size="16" fill="#1c2e38" font-weight="400">负责人席位【本次建议】</text><path d="M970 250V400" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="797" y="312" width="144" height="25" fill="#f5f2e9"/><text x="805" y="330" font-size="16" fill="#526672" font-weight="400">双向发现【已定】</text><path d="M820 460H730" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="729" y="424" width="80" height="25" fill="#f5f2e9"/><text x="737" y="442" font-size="16" fill="#526672" font-weight="400">人工合成</text><path d="M340 460H430" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="339" y="424" width="80" height="25" fill="#f5f2e9"/><text x="347" y="442" font-size="16" fill="#526672" font-weight="400">体内生成</text><path d="M190 250V400" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="44" y="312" width="144" height="25" fill="#f5f2e9"/><text x="52" y="330" font-size="16" fill="#526672" font-weight="400">影响人员【已定】</text><rect x="40" y="675" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="40" y="675" width="6" height="120" rx="3" fill="#53797c"/><text x="60" y="708" font-size="21" fill="#53797c" font-weight="700">普通 / 高级共鸣者</text><text x="60" y="739" font-size="16" fill="#1c2e38" font-weight="400">两种人形敌人【已定】</text><text x="60" y="765" font-size="16" fill="#1c2e38" font-weight="400">高级实验影响方式待核</text><rect x="430" y="675" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="430" y="675" width="6" height="120" rx="3" fill="#53797c"/><text x="450" y="708" font-size="21" fill="#53797c" font-weight="700">C01 · 主角</text><text x="450" y="739" font-size="16" fill="#1c2e38" font-weight="400">应急成员【沿用待核】</text><text x="450" y="765" font-size="16" fill="#1c2e38" font-weight="400">失枪、失联；寻会合路线</text><rect x="820" y="675" width="300" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="820" y="675" width="6" height="120" rx="3" fill="#53797c"/><text x="840" y="708" font-size="21" fill="#53797c" font-weight="700">C02 · 队友 / 联络</text><text x="840" y="739" font-size="16" fill="#1c2e38" font-weight="400">同队关系【沿用待核】</text><text x="840" y="765" font-size="16" fill="#1c2e38" font-weight="400">具体人数、存活与职位未知</text><path d="M190 520V675" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="44" y="585" width="160" height="25" fill="#f5f2e9"/><text x="52" y="603" font-size="16" fill="#526672" font-weight="400">暴露与晶化【已定】</text><path d="M970 520V585H580V675" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="617" y="556" width="208" height="25" fill="#f5f2e9"/><text x="625" y="574" font-size="16" fill="#526672" font-weight="400">事故现场行动【沿用待核】</text><path d="M730 735H820" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="745" y="698" width="48" height="25" fill="#f5f2e9"/><text x="753" y="716" font-size="16" fill="#526672" font-weight="400">同队</text><text x="45" y="855" font-size="17" fill="#63747b" font-weight="400">关系限制：C04 是否成为正式领袖、C04 与 C05 是否同一批幸存者，均未确定。</text></g></svg>