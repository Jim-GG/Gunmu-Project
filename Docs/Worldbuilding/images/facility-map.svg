<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="940" viewBox="0 0 1160 940" role="img" aria-label="零界设施空间拓扑"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#667a88"/></marker></defs><rect width="100%" height="100%" fill="#f5f2e9"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" fill="#1c2e38"><text x="45" y="48" font-size="30" fill="#1c2e38" font-weight="700">两代设施 · 空间拓扑</text><text x="45" y="80" font-size="17" fill="#63747b" font-weight="400">沿用末版总纲的路线提案；不表示真实层高、比例或地图坐标。</text><rect x="300" y="120" width="560" height="95" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="300" y="120" width="6" height="95" rx="3" fill="#53797c"/><text x="320" y="153" font-size="21" fill="#53797c" font-weight="700">地表 · 现代应急区域</text><text x="320" y="184" font-size="16" fill="#1c2e38" font-weight="400">教学、领枪与下行【沿用待核】</text><path d="M580 215V275" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="592" y="234" width="208" height="25" fill="#f5f2e9"/><text x="600" y="252" font-size="16" fill="#526672" font-weight="400">前线电梯 / 第二次冲击</text><rect x="60" y="285" width="470" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="60" y="285" width="6" height="120" rx="3" fill="#53797c"/><text x="80" y="318" font-size="21" fill="#53797c" font-weight="700">苏联实验室① · 冲量储存</text><text x="80" y="349" font-size="16" fill="#1c2e38" font-weight="400">躲避 → 获得兵装 → 格挡与反冲</text><text x="80" y="375" font-size="16" fill="#1c2e38" font-weight="400">与现代区连通【沿用待核】</text><rect x="630" y="285" width="470" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="630" y="285" width="6" height="120" rx="3" fill="#53797c"/><text x="650" y="318" font-size="21" fill="#53797c" font-weight="700">现代实验室② · 定向碰撞</text><text x="650" y="349" font-size="16" fill="#1c2e38" font-weight="400">矢量牵引、物体碰撞</text><text x="650" y="375" font-size="16" fill="#1c2e38" font-weight="400">维护无人机【沿用待核】</text><path d="M530 345H630" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="562" y="312" width="32" height="25" fill="#f5f2e9"/><text x="570" y="330" font-size="16" fill="#526672" font-weight="400">→</text><path d="M865 405V450H295V485" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="482" y="425" width="176" height="25" fill="#f5f2e9"/><text x="490" y="443" font-size="16" fill="#526672" font-weight="400">交错路线【沿用待核】</text><rect x="60" y="495" width="470" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="60" y="495" width="6" height="120" rx="3" fill="#53797c"/><text x="80" y="528" font-size="21" fill="#53797c" font-weight="700">苏联实验室③ · 时间散射</text><text x="80" y="559" font-size="16" fill="#1c2e38" font-weight="400">碰撞回声；两代记录对照</text><text x="80" y="585" font-size="16" fill="#1c2e38" font-weight="400">高级共鸣者【沿用待核】</text><rect x="630" y="495" width="470" height="120" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="630" y="495" width="6" height="120" rx="3" fill="#53797c"/><text x="650" y="528" font-size="21" fill="#53797c" font-weight="700">现代实验室④ · 大型合成设施</text><text x="650" y="559" font-size="16" fill="#1c2e38" font-weight="400">综合能力与失稳逃亡</text><text x="650" y="585" font-size="16" fill="#1c2e38" font-weight="400">不要求独立大型关卡【本次建议】</text><path d="M530 555H630" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="562" y="522" width="32" height="25" fill="#f5f2e9"/><text x="570" y="540" font-size="16" fill="#526672" font-weight="400">→</text><path d="M865 615V655H580V685" fill="none" stroke="#667a88" stroke-width="2"  marker-end="url(#arrow)"/><rect x="647" y="630" width="176" height="25" fill="#f5f2e9"/><text x="655" y="648" font-size="16" fill="#526672" font-weight="400">运输列车【沿用待核】</text><rect x="300" y="690" width="560" height="105" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="300" y="690" width="6" height="105" rx="3" fill="#53797c"/><text x="320" y="723" font-size="21" fill="#53797c" font-weight="700">苏联地下巨构 / 交通枢纽</text><text x="320" y="754" font-size="16" fill="#1c2e38" font-weight="400">祭祀入口反差【已定意向】</text><text x="320" y="780" font-size="16" fill="#1c2e38" font-weight="400">巨构与深层空间的具体形态待核</text><path d="M580 795V850" fill="none" stroke="#667a88" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="597" y="816" width="112" height="25" fill="#f5f2e9"/><text x="605" y="834" font-size="16" fill="#526672" font-weight="400">更深联系未知</text><text x="390" y="890" font-size="21" fill="#63747b" font-weight="700">深渊 · 性质、尺度与回应来源留白</text></g></svg>