<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1340" viewBox="0 0 1160 1340" role="img" aria-label="零界历史与现代事故时间线"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#667a88"/></marker></defs><rect width="100%" height="100%" fill="#f5f2e9"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" fill="#1c2e38"><text x="45" y="48" font-size="30" fill="#1c2e38" font-weight="700">历史与事故时间线</text><text x="45" y="80" font-size="17" fill="#63747b" font-weight="400">先后关系与证据状态并列；1984、2028 尚待作者确认。</text><path d="M88 130V1230" stroke="#a4b0ad" stroke-width="4"/><circle cx="88" cy="155" r="10" fill="#53797c"/><rect x="130" y="120" width="975" height="106" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="130" y="120" width="6" height="106" rx="3" fill="#53797c"/><text x="150" y="153" font-size="21" fill="#53797c" font-weight="700">苏联建站、早期小规模共振</text><text x="150" y="184" font-size="16" fill="#1c2e38" font-weight="400">冷战时期 / 年份未知 · 建站背景【沿用待核】；研究共振【已定】</text><circle cx="88" cy="283" r="10" fill="#53797c"/><rect x="130" y="248" width="975" height="106" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="130" y="248" width="6" height="106" rx="3" fill="#53797c"/><text x="150" y="281" font-size="21" fill="#53797c" font-weight="700">一名设施高层受影响</text><text x="150" y="312" font-size="16" fill="#1c2e38" font-weight="400">首次有效回应 · 推动更多、更大的共振实验室【已定】</text><circle cx="88" cy="411" r="10" fill="#53797c"/><rect x="130" y="376" width="975" height="106" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="130" y="376" width="6" height="106" rx="3" fill="#53797c"/><text x="150" y="409" font-size="21" fill="#53797c" font-weight="700">结晶、成瘾、聚集与传教</text><text x="150" y="440" font-size="16" fill="#1c2e38" font-weight="400">秘密扩张阶段 · 制造更多可回应结晶个体【已定】</text><circle cx="88" cy="539" r="10" fill="#b88b42"/><rect x="130" y="504" width="975" height="106" rx="10" fill="#fffdf7" stroke="#a87a33" stroke-width="2"/><rect x="130" y="504" width="6" height="106" rx="3" fill="#a87a33"/><text x="150" y="537" font-size="21" fill="#a87a33" font-weight="700">零号灾难与封锁</text><text x="150" y="568" font-size="16" fill="#1c2e38" font-weight="400">1984 · 待核 · 灾难及动机【已定】；年份与封锁细节待核</text><circle cx="88" cy="667" r="10" fill="#53797c"/><rect x="130" y="632" width="975" height="106" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="130" y="632" width="6" height="106" rx="3" fill="#53797c"/><text x="150" y="665" font-size="21" fill="#53797c" font-weight="700">未完全晶化的成瘾群体仍在地下</text><text x="150" y="696" font-size="16" fill="#1c2e38" font-weight="400">灾后数十年 · 幸存【已定】；生存机制与代际关系留白</text><circle cx="88" cy="795" r="10" fill="#b88b42"/><rect x="130" y="760" width="975" height="106" rx="10" fill="#fffdf7" stroke="#a87a33" stroke-width="2"/><rect x="130" y="760" width="6" height="106" rx="3" fill="#a87a33"/><text x="150" y="793" font-size="21" fill="#a87a33" font-weight="700">现代碰撞合成出同类晶体</text><text x="150" y="824" font-size="16" fill="#1c2e38" font-weight="400">2028 · 待核 · 无人体合成【已定】；年份、编号待核</text><circle cx="88" cy="923" r="10" fill="#53797c"/><rect x="130" y="888" width="975" height="106" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="130" y="888" width="6" height="106" rx="3" fill="#53797c"/><text x="150" y="921" font-size="21" fill="#53797c" font-weight="700">发现旧设施，第一次冲击后救援进入</text><text x="150" y="952" font-size="16" fill="#1c2e38" font-weight="400">现代事故前后 · 双向发现【已定】；第一次冲击顺序待核</text><circle cx="88" cy="1051" r="10" fill="#53797c"/><rect x="130" y="1016" width="975" height="106" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="130" y="1016" width="6" height="106" rx="3" fill="#53797c"/><text x="150" y="1049" font-size="21" fill="#53797c" font-weight="700">第二次冲击，失枪、与队友失联</text><text x="150" y="1080" font-size="16" fill="#1c2e38" font-weight="400">主角乘电梯时 · 待核 · 第二次冲击【已定核心】；具体演出待核</text><circle cx="88" cy="1179" r="10" fill="#53797c"/><rect x="130" y="1144" width="975" height="106" rx="10" fill="#fffdf7" stroke="#53797c" stroke-width="2"/><rect x="130" y="1144" width="6" height="106" rx="3" fill="#53797c"/><text x="150" y="1177" font-size="21" fill="#53797c" font-weight="700">列车逃亡，揭示巨构与祭祀痕迹</text><text x="150" y="1208" font-size="16" fill="#1c2e38" font-weight="400">序章尾声 · 待核 · 祭祀反差【已定意向】；镜头与路线待核</text><text x="45" y="1300" font-size="17" fill="#63747b" font-weight="400">事件顺序不等于精确时刻；第一成功回应、零号灾难与现代两次冲击是四个不同节点。</text></g></svg>